[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-thread"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
sdd-core = "sdd_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdd_core = ["skills/*.md"]
