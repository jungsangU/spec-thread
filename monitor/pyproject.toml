[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-thread-monitor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["spec-thread==0.6.0"]

[project.scripts]
specthread-monitor = "specthread_monitor.server:main"

[tool.setuptools.package-data]
specthread_monitor = ["ui/*"]
